name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore tracker3d-release.jks -alias tracker3d -keyalg RSA -keysize 2048 -validity 10000 -storepass tracker3dkey -keypass tracker3dkey -dname "CN=Tracker3D, OU=Mobile, O=Tracker3D, L=Bandung, ST=JawaBarat, C=ID"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 tracker3d-release.jks > ANDROID_KEYSTORE_BASE64.txt
          echo "Keystore size: $(wc -c < ANDROID_KEYSTORE_BASE64.txt) bytes (base64)"

      - name: Upload Base64 value
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secret-value
          path: ANDROID_KEYSTORE_BASE64.txt
          retention-days: 1

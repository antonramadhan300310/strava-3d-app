name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
          NEXT_PUBLIC_ORS_API_KEY: ${{ secrets.NEXT_PUBLIC_ORS_API_KEY }}
          NEXT_PUBLIC_OWNER_EMAIL: ${{ secrets.NEXT_PUBLIC_OWNER_EMAIL }}
          NEXT_PUBLIC_ADMIN_WHATSAPP: ${{ secrets.NEXT_PUBLIC_ADMIN_WHATSAPP }}
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode Android Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            {
              echo "ANDROID_KEYSTORE_PATH=release-keystore.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tracker3dkey' }}"
              echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'tracker3d' }}"
              echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'tracker3dkey' }}"
            } >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded, release APK will be signed."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - falling back to an unsigned debug APK."
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Package OTA bundle and version manifest
        run: |
          # The bundle is named after the build, so its public URL is stable and
          # needs no cache-busting query string on the client.
          OTA_VERSION="1.3.${{ github.run_number }}"
          OTA_BUNDLE="allmova-ota-${OTA_VERSION}.zip"
          OTA_PUBLIC_BASE="https://adnboduimzesbvbejdwr.supabase.co/storage/v1/object/public/ota-updates"
          echo "OTA_VERSION=$OTA_VERSION" >> "$GITHUB_ENV"
          echo "OTA_BUNDLE=$OTA_BUNDLE" >> "$GITHUB_ENV"
          rm -f "$OTA_BUNDLE"
          ( cd out && zip -r -q "../$OTA_BUNDLE" . )
          # capgo 6.53.0 refuses `CapacitorUpdater.download()` without a SHA-256
          # (CapgoUpdater.requireBundleChecksum), so the manifest must publish it.
          OTA_CHECKSUM=$(sha256sum "$OTA_BUNDLE" | awk '{print $1}')
          echo "OTA_CHECKSUM=$OTA_CHECKSUM" >> "$GITHUB_ENV"
          # capgo unzips the bundle as the web root: index.html must sit at the
          # top level, never inside dist/ or out/, or `download` rejects it.
          python3 - "$OTA_BUNDLE" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          if 'index.html' not in names:
              sys.exit('OTA bundle is missing index.html at its root, first entries: %s' % names[:5])
          print('OTA bundle OK: %d entries, index.html at root' % len(names))
          PY
          # otaVersion is semver so the client can order builds; buildNumber is
          # the same CI run number the client compares against. minNativeVersion
          # tracks the `versionName "1.2.<run>"` line in android/app/build.gradle:
          # raising it locks out older APKs, so only bump it with a new APK.
          cat > version.json <<EOF
          {
            "otaVersion": "${OTA_VERSION}",
            "buildNumber": ${{ github.run_number }},
            "commitSha": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minNativeVersion": "1.2.0",
            "url": "${OTA_PUBLIC_BASE}/${OTA_BUNDLE}",
            "bundleUrl": "${OTA_PUBLIC_BASE}/${OTA_BUNDLE}",
            "checksum": "${OTA_CHECKSUM}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/ota-latest/allmova-latest.apk",
            "releaseNotes": "Pembaruan otomatis ALLMOVA (build ${{ github.run_number }})."
          }
          EOF
          python3 - <<'PY'
          import json
          manifest = json.load(open('version.json'))
          checksum = manifest.get('checksum', '')
          if len(checksum) != 64 or any(c not in '0123456789abcdef' for c in checksum):
              raise SystemExit('version.json checksum is not a SHA-256 hex digest: %r' % checksum)
          print('manifest OK:', manifest['otaVersion'], checksum)
          PY
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk allmova-latest.apk
          else
            cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)" allmova-latest.apk
          fi
          ls -lh "$OTA_BUNDLE" allmova-latest.apk version.json

      - name: Publish OTA to Supabase Storage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL dan SUPABASE_SERVICE_ROLE_KEY wajib diisi untuk publikasi OTA."
            exit 1
          fi
          upload_object() {
            src="$1"
            dest="$2"
            content_type="$3"
            code=$(curl -sS -o /tmp/ota-upload.out -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "x-upsert: true" \
              -H "cache-control: max-age=0" \
              -H "Content-Type: $content_type" \
              --data-binary "@$src" \
              "$SUPABASE_URL/storage/v1/object/ota-updates/$dest")
            echo "Upload $dest -> HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              cat /tmp/ota-upload.out
              echo "::error::Upload $dest gagal (HTTP $code)."
              exit 1
            fi
          }
          # version.json goes last: a client must never see a manifest whose
          # bundle is not in the bucket yet.
          upload_object "$OTA_BUNDLE" "$OTA_BUNDLE" "application/zip"
          upload_object version.json version.json "application/json"
          echo "OTA $OTA_VERSION published to Supabase Storage (bucket ota-updates)."

      - name: Verify published OTA (checksum + zip root)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # What the device will actually download must match the manifest the
          # device reads; a stale CDN object would fail the native checksum gate.
          python3 - <<'PY'
          import hashlib, io, json, os, time, urllib.request, zipfile
          base = 'https://adnboduimzesbvbejdwr.supabase.co/storage/v1/object/public/ota-updates'
          with urllib.request.urlopen(f"{base}/version.json?t={int(time.time())}", timeout=30) as res:
              manifest = json.load(res)
          expected_version = os.environ['OTA_VERSION']
          if manifest.get('otaVersion') != expected_version:
              raise SystemExit(f"published manifest is {manifest.get('otaVersion')!r}, expected {expected_version!r}")
          with urllib.request.urlopen(manifest['url'], timeout=60) as res:
              body = res.read()
          actual = hashlib.sha256(body).hexdigest()
          if actual != manifest.get('checksum'):
              raise SystemExit(f"bundle sha256 {actual} != manifest checksum {manifest.get('checksum')}")
          names = zipfile.ZipFile(io.BytesIO(body)).namelist()
          if 'index.html' not in names:
              raise SystemExit(f'bundle is missing index.html at its root: {names[:5]}')
          print(f"published OTA OK: {expected_version}, {len(body)} bytes, sha256 {actual}, {len(names)} entries")
          PY

      - name: Publish OTA release (ota-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ota-latest > /dev/null 2>&1; then
            gh release upload ota-latest "$OTA_BUNDLE" version.json allmova-latest.apk --clobber
          else
            gh release create ota-latest "$OTA_BUNDLE" version.json allmova-latest.apk \
              --title "ALLMOVA OTA" \
              --notes "Paket live update ALLMOVA (unduhan utama: Supabase Storage, bucket ota-updates)." \
              --latest=false
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-3d-apk
          path: android/app/build/outputs/apk/**/*.apk

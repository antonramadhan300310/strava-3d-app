name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
          NEXT_PUBLIC_ORS_API_KEY: ${{ secrets.NEXT_PUBLIC_ORS_API_KEY }}
          NEXT_PUBLIC_OWNER_EMAIL: ${{ secrets.NEXT_PUBLIC_OWNER_EMAIL }}
          NEXT_PUBLIC_ADMIN_WHATSAPP: ${{ secrets.NEXT_PUBLIC_ADMIN_WHATSAPP }}
          # The OTA client reads the release of the repository that built the APK.
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode Android Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            {
              echo "ANDROID_KEYSTORE_PATH=release-keystore.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tracker3dkey' }}"
              echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'tracker3d' }}"
              echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'tracker3dkey' }}"
            } >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded, release APK will be signed."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - falling back to an unsigned debug APK."
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Package OTA bundle and version manifest
        run: |
          cd out && zip -r ../allmova-ota-bundle.zip . && cd ..
          cat > version.json <<EOF
          {
            "otaVersion": "${{ github.run_number }}-${{ github.sha }}",
            "minNativeVersion": "1.3.0",
            "bundleUrl": "https://github.com/${{ github.repository }}/releases/download/ota-latest/allmova-ota-bundle.zip",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/ota-latest/allmova-latest.apk",
            "releaseNotes": "Pembaruan otomatis ALLMOVA (build ${{ github.run_number }})."
          }
          EOF
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk allmova-latest.apk
          else
            cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)" allmova-latest.apk
          fi
          ls -lh allmova-ota-bundle.zip allmova-latest.apk version.json

      - name: Publish OTA release (ota-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ota-latest > /dev/null 2>&1; then
            gh release upload ota-latest allmova-ota-bundle.zip version.json allmova-latest.apk --clobber
          else
            gh release create ota-latest allmova-ota-bundle.zip version.json allmova-latest.apk \
              --title "ALLMOVA OTA" \
              --notes "Paket live update ALLMOVA. Jangan hapus tag ini: aplikasi memeriksa aset version.json di sini." \
              --latest=false
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-3d-apk
          path: android/app/build/outputs/apk/**/*.apk
